<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OP-XY → SFZ</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #111; color: #eee; padding: 2rem; }
    h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 1.5rem; }
    #drop-zone {
      border: 2px dashed #444;
      border-radius: 8px;
      padding: 3rem;
      text-align: center;
      color: #888;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    #drop-zone.over { border-color: #fff; color: #fff; }
    #preset-list { margin-top: 1.5rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .preset-row {
      display: flex; align-items: center; gap: 1rem;
      background: #1e1e1e; border-radius: 6px; padding: 0.75rem 1rem;
    }
    .preset-name { flex: 1; font-size: 0.95rem; }
    .status { font-size: 0.8rem; color: #888; min-width: 80px; }
    .status.done { color: #4caf50; }
    .status.error { color: #f44336; }
    .status.converting { color: #2196f3; }
    button {
      background: #333; color: #eee; border: 1px solid #555;
      border-radius: 4px; padding: 0.3rem 0.75rem;
      cursor: pointer; font-size: 0.85rem;
    }
    button:hover { background: #444; }
    button:disabled { opacity: 0.4; cursor: default; }
    #download-all-wrap { margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>OP-XY → SFZ Converter</h1>
  <div id="drop-zone">Drop .preset folders here (multiple allowed)</div>
  <div id="preset-list"></div>
  <div id="download-all-wrap" style="display:none">
    <button id="download-all-btn">Download All (.zip)</button>
  </div>

  <script>
    const dropZone = document.getElementById('drop-zone');
    const presetList = document.getElementById('preset-list');
    const downloadAllWrap = document.getElementById('download-all-wrap');
    const downloadAllBtn = document.getElementById('download-all-btn');

    // Map: preset name → Blob
    const convertedBlobs = new Map();

    dropZone.addEventListener('dragover', e => {
      e.preventDefault();
      dropZone.classList.add('over');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
    dropZone.addEventListener('drop', async e => {
      e.preventDefault();
      dropZone.classList.remove('over');
      const items = [...e.dataTransfer.items].filter(i => i.kind === 'file');
      for (const item of items) {
        const handle = await item.getAsFileSystemHandle();
        if (handle && handle.kind === 'directory') {
          await processPreset(handle);
        }
      }
    });

    async function processPreset(dirHandle) {
      const name = dirHandle.name;
      const row = addRow(name);

      // Collect files from directory
      const files = [];
      for await (const [filename, fileHandle] of dirHandle.entries()) {
        if (fileHandle.kind === 'file') {
          files.push(await fileHandle.getFile());
        }
      }

      const hasPatch = files.some(f => f.name === 'patch.json');
      if (!hasPatch) {
        setStatus(row, 'error', 'No patch.json');
        return;
      }

      setStatus(row, 'converting', 'Converting…');
      const formData = new FormData();
      for (const file of files) {
        formData.append('files', file, file.name);
      }

      try {
        const response = await fetch('/convert', { method: 'POST', body: formData });
        if (!response.ok) {
          const err = await response.json().catch(() => ({ detail: response.statusText }));
          setStatus(row, 'error', err.detail || 'Error');
          return;
        }
        const blob = await response.blob();
        const presetName = name.replace(/\.preset$/, '');
        convertedBlobs.set(presetName, blob);
        setStatus(row, 'done', 'Done');
        enableDownload(row, presetName, blob);
        updateDownloadAll();
      } catch (err) {
        setStatus(row, 'error', String(err));
      }
    }

    function addRow(name) {
      const row = document.createElement('div');
      row.className = 'preset-row';
      row.innerHTML = `
        <span class="preset-name">${escapeHtml(name)}</span>
        <span class="status">Queued</span>
      `;
      presetList.appendChild(row);
      return row;
    }

    function setStatus(row, cls, text) {
      const s = row.querySelector('.status');
      s.className = `status ${cls}`;
      s.textContent = text;
    }

    function enableDownload(row, name, blob) {
      const btn = document.createElement('button');
      btn.textContent = 'Download';
      btn.onclick = () => triggerDownload(blob, `${name}.zip`);
      row.appendChild(btn);
    }

    function updateDownloadAll() {
      downloadAllWrap.style.display = convertedBlobs.size > 0 ? 'block' : 'none';
    }

    downloadAllBtn.onclick = async () => {
      downloadAllBtn.disabled = true;
      const zip = new JSZip();
      for (const [name, blob] of convertedBlobs) {
        zip.file(`${name}.zip`, blob);
      }
      const content = await zip.generateAsync({ type: 'blob' });
      triggerDownload(content, 'opxy-sfz-presets.zip');
      downloadAllBtn.disabled = false;
    };

    function triggerDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  </script>
</body>
</html>
